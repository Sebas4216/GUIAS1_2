<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrega de Guías | Sebastian Enrique Gurreonero Lobaton</title>
    <style>
        /* ===== Estilos Base ===== */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        :root {
            --cafe: #5C3A00;      
            --amarillo: #FDB913;  
            --crema: #FFF8E7;     
            --texto: #2B2118;     
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1rem;
            line-height: 1.5;
            color: var(--texto);
            background: var(--crema);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main {
            max-width: 800px;
            margin: auto;
            padding: 2rem 1rem;
            text-align: center;
            width: 100%;
        }

        /* ===== Tipografía ===== */
        h1 {
            color: var(--cafe);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }

        .nombre {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--texto);
            margin-bottom: 2rem;
        }

        /* ===== Contenedor de Enlaces ===== .links-container */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 400px;
            margin: 0 auto;
        }

        .btn-link {
            display: block;
            padding: 0.9rem 1.5rem;
            background: var(--cafe);
            color: var(--crema);
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 999px;
            border: 2px solid var(--cafe);
            transition: background 0.2s, color 0.2s;
        }

        .btn-link:hover {
            background: var(--amarillo);
            color: #161616;
            border-color: var(--amarillo);
        }

        /* ===== Accesibilidad ===== */
        a:focus-visible {
            outline: 3px solid #161616;
            outline-offset: 2px;
        }
    </style>
</head>

<body>
    <main>
        <h1>Entrega de Guías</h1>
        <p class="nombre">Sebastian Enrique Gurreonero Lobaton</p>
        
        <div class="links-container">
            <a href="Guia1/santa-rosa-Gurreonero/index.html" class="btn-link" target="_blank" rel="noopener noreferrer">Ver Guía 1</a>
            
            <a href="Guia2/santa-rosa-Gurreonero/index.html" class="btn-link" target="_blank" rel="noopener noreferrer">Ver Guía 2</a>

            <a href="Guia3/index.html" class="btn-link" target="_blank" rel="noopener noreferrer">Ver Guía 3</a>
        </div>
    </main>
</body>
</html>
